[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-tau2-bench"
version = "2.0.0"
description = "Standalone local voice-agent benchmark using speech-swift"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Victor Barres"}, {name = "Honghua Dong"}]
dependencies = [
    "pydantic>=2.11", "typing-extensions>=4.12", "rich", "tabulate>=0.9",
    "pandas>=2.2.3", "loguru>=0.7.3", "docstring-parser>=0.16",
    "deepdiff>=8.4.2", "addict>=2.4", "PyYAML>=6.0.2", "toml>=0.10.2",
    "python-dotenv>=1.0", "numpy>=1.24", "httpx>=0.24",
    "jiwer>=3", "scipy>=1.10", "pydub>=0.25",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
voice-local = []
nova = ["boto3==1.43.121", "aws-sdk-bedrock-runtime[awscrt]==0.12.0"]
dev = ["pytest>=8.3.5", "ruff>=0.9.1", "pre-commit>=4"]

[project.urls]
Repository = "https://github.com/soniqo/voice-tau2-bench"
Upstream = "https://github.com/sierra-research/tau2-bench"

[project.scripts]
tau-voice = "tau2.voice.cli:main"
tau-voice-nova = "tau2.voice.nova_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tau2"]

[tool.pytest.ini_options]
markers = ["local_models: opt-in actual native models (SPEECH_SWIFT_INFERENCE_URL)", "full_duplex_integration: requires native model integration"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F541"]

[tool.ruff]
line-length = 88
exclude = ["*.ipynb"]
